name: CI
on: [push, pull_request]
jobs:
  lightweight:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    env:
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          # The integrity regression reads the eight legacy blobs at their base commit.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -e ".[test]"
      - run: python -m pytest -q
      - run: node --test tests/web_review.test.cjs
      - run: python -m compileall -q src server tests
      - run: python -m paleographia --help
      - name: Conferir evidências do teste lexical em cópia
        run: python docs/testes/lexico_copia_20261019/verificar.py
      - name: Conferir evidências da sessão humana do 269r
        run: python docs/revisao_humana/traslado_269r/sessao_20261019/verificar.py
      - name: Conferir referência assistida de 24 linhas do 269r
        run: python docs/revisao_humana/traslado_269r/referencia_assistida_20261020/verificar.py
      - name: Conferir diagnóstico assistido PP-OCRv5 e PP-OCRv6
        run: python docs/experimentos/traslado_269r_reconhecedores_24_20261020/verificar.py
      - name: Conferir auxiliares históricos arquivados
        run: python legacy/auxiliares_20261020/verificar.py
