# Curadoria do segundo documento do TESTE reservado: contrato de Francisco Vieira da Costa
# e Manoel da Siqueira Gil, 27/08/1763, Cartório Olgado, livro 12, folhas 278 e 279.
#
# Reconhecedor DESLIGADO de propósito: a referência diplomática do teste deve ser produzida
# sem ver sugestões de modelos. Não reutilize este workspace para treino, escolha de
# parâmetros ou checkpoints.
# Decisão registrada em docs/revisao_humana/contrato_livro12_teste/.

[paths]
workspace = "data/workspace_teste_contrato12"

[recognition]
backend = "disabled"

[presentation]
language = "pt-BR"
automatic_transcription_enabled = false

[segmentation]
detector = "projection"
horizontal_margin_ratio = 0.06
smoothing_ratio = 0.003
peak_threshold_std = 0.2
min_peak_distance_ratio = 0.019
block_size = 31
threshold_c = 15
kernel_width_ratio = 0.025
kernel_height = 3
iterations = 1
min_width_ratio = 0.12
min_height_ratio = 0.002
max_height_ratio = 0.12
padding = 4
