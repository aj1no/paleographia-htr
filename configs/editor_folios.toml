# Editor para fólios novos: importar imagem, segmentar, pedir sugestão do
# PP-OCRv6 e registrar a leitura humana. Workspace próprio, separado dos
# workspaces publicados (piloto de 1831, Traslado 269r e curadoria de 1795).
#
# As sugestões ficam liberadas só para a identidade exata avaliada no 269r
# (peso, imagem Docker e worker). Se qualquer uma mudar, o editor volta a
# esconder as sugestões até nova avaliação; a revisão manual continua.
# Diagnóstico de apoio em 05/11/2026, sem valor de teste reservado: nas oito
# linhas da sessão de 1795 o CER por linha ficou entre 8% e 19%.

[paths]
workspace = "data/workspace_folios"

[recognition]
backend = "kraken_ppocrv6"
model = "models/kraken_ppocrv6_medium/medium.safetensors"
sha256 = "15313b51ace64cbfa81f8f6ef25ad64f04e5a6fb7f7823e67b107527bc081ac9"
docker_image = "paleographia-kraken:7.1.0-cpu"
docker_image_id = "sha256:511fb2e2b76db8de0d3eb87dcf04398f7a02fc06b5d91887629b2492f826af5b"
device = "cpu"
precision = "float32"
timeout_seconds = 180

[presentation]
language = "pt-BR"
automatic_transcription_enabled = true
evaluated_backend = "kraken_ppocrv6"
evaluated_model_sha256 = "15313b51ace64cbfa81f8f6ef25ad64f04e5a6fb7f7823e67b107527bc081ac9"
evaluated_docker_image_id = "sha256:511fb2e2b76db8de0d3eb87dcf04398f7a02fc06b5d91887629b2492f826af5b"
evaluated_worker_sha256 = "825d6bea5171187c9f6dfa310f1fd0a9cc8fe933e9f72417f3ea43a0c628029a"

[segmentation]
detector = "projection"
horizontal_margin_ratio = 0.06
smoothing_ratio = 0.003
peak_threshold_std = 0.2
min_peak_distance_ratio = 0.019
block_size = 31
threshold_c = 15
kernel_width_ratio = 0.025
kernel_height = 3
iterations = 1
min_width_ratio = 0.12
min_height_ratio = 0.002
max_height_ratio = 0.12
padding = 4
