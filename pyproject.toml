[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "paleographia"
version = "0.2.0"
description = "Local, auditable manuscript transcription pilot"
requires-python = ">=3.11,<3.13"
dependencies = [
  "Pillow==11.3.0", "numpy==2.2.6", "opencv-python-headless==4.12.0.88",
  "fastapi==0.116.1", "uvicorn==0.35.0", "python-multipart==0.0.20",
  "jiwer==4.0.0", "pydantic==2.11.7", "pyspellchecker==0.8.3"
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "httpx==0.28.1"]
htr = ["torch==2.7.1", "torchvision==0.22.1", "transformers==4.57.1", "sentencepiece==0.2.1", "protobuf==6.32.0", "accelerate==1.10.1"]
pdf = ["pypdf==6.1.1", "rarfile==4.2"]
ocr = ["onnxruntime==1.23.2"]

[project.scripts]
paleographia = "paleographia.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
paleographia = ["web/*.html", "web/*.js"]

[tool.ruff]
# Frozen evidence copies under docs/ and legacy/ are preserved byte for byte.
src = ["src", "tests"]
extend-exclude = ["docs", "legacy", "experiments", "output", "tmp"]

[tool.ruff.lint]
# Syntax errors and pyflakes only: undefined names, unused imports/variables.
select = ["E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Byte-pinned by frozen experiment audits (docs/experimentos/*/verificar.py and
# frozen_experiment inventories): removing their unused imports breaks the hashes.
"src/paleographia/experiments.py" = ["F401"]
"src/paleographia/lexicon.py" = ["F401"]
"src/paleographia/recognition.py" = ["F401"]
"src/paleographia/training.py" = ["F401"]

[tool.pytest.ini_options]
testpaths = ["tests"]
